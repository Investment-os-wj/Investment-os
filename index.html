<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Investment OS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}
.container{
  max-width:600px;
  margin:auto;
  padding:28px 18px 100px;
}
h1{font-size:30px;margin-bottom:4px}
.sub{color:#8e9bb5;margin-bottom:28px}

.card{
  background:#151c31;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.card h2{
  margin:0 0 12px;
  font-size:17px;
}
.row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #26304a;
}
.row:last-child{border:0}

.green{color:#40d98b}
.yellow{color:#ffd166}
.red{color:#ff6b6b}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#10172a;
  padding:14px 8px calc(14px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-around;
  border-top:1px solid #26304a;
}
.nav span{
  color:#aab4ca;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>Investment OS</h1>
<div class="sub">Personal Investment Command Center · V1.1</div>

<div class="card">
<h2>今日状态</h2>
<div class="row"><span>市场风险</span><b class="yellow">● 中性</b></div>
<div class="row"><span>现金策略</span><b>保持机动</b></div>
<div class="row"><span>系统状态</span><b class="green">● ONLINE</b></div>
</div>

<div class="card">
<h2>核心关注</h2>
<div class="row"><span>SPCX</span><b>等待合理买点</b></div>
<div class="row"><span>AVEX</span><b>重点跟踪</b></div>
<div class="row"><span>RDW</span><b>观察</b></div>
<div class="row"><span>USAR</span><b>财报跟踪</b></div>
</div>

<div class="card">
<h2>风险仪表盘</h2>
<div class="row"><span>VIX</span><b class="yellow">● 待接实时数据</b></div>
<div class="row"><span>美债收益率</span><b class="yellow">● 待接实时数据</b></div>
<div class="row"><span>信用利差</span><b class="yellow">● 待接实时数据</b></div>
</div>

<div class="card">
<h2>资产监控</h2>
<div class="row"><span>黄金 / 白银</span><b>监控</b></div>
<div class="row"><span>BTC / ETH / UNI</span><b>监控</b></div>
<div class="row"><span>A股</span><b>监控</b></div>
</div>

</div>

<div class="nav">
<span>总览</span>
<span>持仓</span>
<span>市场</span>
<span>操作</span>
<span>设置</span>
</div>

</body>
</html>
